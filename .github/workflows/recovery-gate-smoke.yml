name: recovery-gate-smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/recovery-gate-smoke.yml"
      - ".github/workflows/recovery-authorization.yml"
      - ".github/workflows/recovery-executor.yml"
      - ".github/workflows/promotion-executor.yml"
      - ".github/scripts/enforce-recovery-gate.mjs"
      - ".github/scripts/probe-recovery-gate.mjs"
      - ".github/scripts/discover-recovery-target.mjs"
      - ".github/scripts/authorize-recovery.mjs"
      - ".github/scripts/execute-recovery.mjs"
      - ".github/scripts/recovery-execution.selftest.mjs"
      - ".github/scripts/recovery-runtime-smoke.mjs"
      - "apps/telemetry-control/**"

permissions:
  actions: read
  contents: read

jobs:
  validate-real-recovery-gate:
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      HNK_TELEMETRY_BASE_URL: ${{ secrets.HNK_TELEMETRY_BASE_URL }}
      HNK_TELEMETRY_ADMIN_TOKEN: ${{ secrets.HNK_TELEMETRY_ADMIN_TOKEN }}
      HNK_GAME_PRODUCTION_URL: ${{ secrets.HNK_GAME_PRODUCTION_URL }}
      HNK_CANDIDATE_ID: recovery-gate-smoke
      HNK_AUTHORIZATION_ID: recovery-gate-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe authenticated Recovery Gate without changing production
        run: node .github/scripts/probe-recovery-gate.mjs

      - name: Discover current production and last proven healthy recovery target
        run: node .github/scripts/discover-recovery-target.mjs

      - name: Upload recovery smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-gate-smoke-${{ github.run_id }}
          path: |
            artifacts/promotion-input/recovery-gate.json
            artifacts/promotion-input/recovery-gate.md
            artifacts/recovery-target/recovery-target-discovery.json
            artifacts/recovery-target/recovery-target-discovery.md
            artifacts/recovery-target/healthy-promotion-report.json
          if-no-files-found: warn
          retention-days: 30
