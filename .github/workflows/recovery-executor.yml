name: recovery-executor

on:
  workflow_dispatch:
    inputs:
      recovery_authorization_id:
        description: "Recovery Authorization ID"
        required: true
        type: string
      target_sha:
        description: "Exact previously healthy SHA"
        required: true
        type: string
  workflow_run:
    workflows: ["recovery-authorization"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: recovery-${{ github.event.workflow_run.id || inputs.target_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      HNK_RECOVERY_AUTHORIZATION_ID: ${{ inputs.recovery_authorization_id }}
      HNK_RECOVERY_TARGET_SHA: ${{ inputs.target_sha }}
      HNK_RENDER_DEPLOY_HOOK_URL: ${{ secrets.HNK_RENDER_DEPLOY_HOOK_URL }}
      HNK_GAME_PRODUCTION_URL: ${{ secrets.HNK_GAME_PRODUCTION_URL }}
      HNK_TELEMETRY_BASE_URL: ${{ secrets.HNK_TELEMETRY_BASE_URL }}
      HNK_TELEMETRY_ADMIN_TOKEN: ${{ secrets.HNK_TELEMETRY_ADMIN_TOKEN }}
      HNK_TELEMETRY_GAME_ORIGIN: ${{ secrets.HNK_TELEMETRY_GAME_ORIGIN }}
    steps:
      - name: Require deterministic recovery executor snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            source_head='${{ github.event.workflow_run.head_sha }}'
            test "$GITHUB_SHA" = "$source_head" || { echo "Main advanced after recovery authorization ($source_head -> $GITHUB_SHA); rerun recovery authorization on current main" >&2; exit 1; }
          else
            test "$GITHUB_REF" = "refs/heads/main" || { echo "Manual recovery executor must be dispatched from main; got $GITHUB_REF" >&2; exit 1; }
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate exact recovery authorization evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/recovery-execution-input /tmp/hnk-recovery-auth-search

          validate_and_bind() {
            local auth="$1"
            local healthy="$2"
            local source_run="$3"
            local source_event="$4"
            local source_branch="$5"
            local source_head_sha="$6"
            local source_repo="$7"
            node - "$auth" "$healthy" "$source_run" "$source_event" "$source_branch" "$source_head_sha" "$source_repo" <<'NODE'
          const fs = require('fs');
          const [authPath, healthyPath, sourceRun, sourceEvent, sourceBranch, sourceHeadSha, sourceRepo] = process.argv.slice(2);
          const auth = JSON.parse(fs.readFileSync(authPath, 'utf8'));
          const healthy = JSON.parse(fs.readFileSync(healthyPath, 'utf8'));
          const provenance = auth?.provenance ?? {};
          if (auth?.authorized !== true || auth?.decision !== 'authorized') throw new Error('recovery authorization is not authorized');
          if (auth?.signature !== 'Tehkné Solutions') throw new Error('recovery authorization signature invalid');
          if (!/^[0-9a-f]{40}$/i.test(auth?.targetSha ?? '')) throw new Error('recovery authorization target SHA invalid');
          if (!/^[0-9a-f]{20}$/i.test(auth?.incidentFingerprint ?? '')) throw new Error('recovery authorization incident fingerprint invalid');
          if (sourceEvent !== 'workflow_dispatch') throw new Error(`recovery authorization source event invalid: ${sourceEvent}`);
          if (sourceBranch !== 'main') throw new Error(`recovery authorization source branch invalid: ${sourceBranch}`);
          if (!/^[0-9a-f]{40}$/i.test(sourceHeadSha ?? '')) throw new Error('recovery authorization source head SHA invalid');
          if (sourceRepo !== process.env.GITHUB_REPOSITORY) throw new Error(`recovery authorization source repository mismatch: ${sourceRepo}`);
          if (provenance?.authorizationWorkflow !== 'recovery-authorization') throw new Error('recovery authorization workflow provenance invalid');
          if (String(provenance?.sourceWorkflowRunId ?? '') !== String(sourceRun)) throw new Error('recovery authorization source run mismatch');
          if (provenance?.sourceRepository !== sourceRepo) throw new Error('recovery authorization provenance repository mismatch');
          if (provenance?.sourceRef !== 'refs/heads/main') throw new Error(`recovery authorization provenance ref invalid: ${provenance?.sourceRef ?? 'missing'}`);
          if (provenance?.sourceHeadSha !== sourceHeadSha) throw new Error('recovery authorization provenance head SHA mismatch');
          if (healthy?.status !== 'completed' || healthy?.candidateSha !== auth.targetSha || healthy?.verifiedManifest?.buildSha !== auth.targetSha) {
            throw new Error('healthy promotion evidence does not prove authorized target');
          }
          if (healthy?.signature !== 'Tehkné Solutions' || healthy?.verifiedManifest?.signature !== 'Tehkné Solutions') {
            throw new Error('healthy promotion evidence signature invalid');
          }
          fs.copyFileSync(authPath, 'artifacts/recovery-execution-input/recovery-authorization.json');
          fs.copyFileSync(healthyPath, 'artifacts/recovery-execution-input/healthy-promotion-report.json');
          fs.appendFileSync(process.env.GITHUB_ENV, `HNK_RECOVERY_AUTHORIZATION_ID=${auth.authorizationId}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `HNK_RECOVERY_TARGET_SHA=${auth.targetSha}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n## Recovery Execution Binding\n\n- Source authorization run: **${sourceRun}**\n- Source branch: \`${sourceBranch}\`\n- Source head SHA: \`${sourceHeadSha}\`\n- Authorization: **${auth.authorizationId}**\n- Incident: \`${auth.incidentFingerprint}\`\n- Exact target: \`${auth.targetSha}\`\n\nTehkné Solutions\n`);
          console.log(`recovery execution binding: run=${sourceRun} branch=${sourceBranch} head=${sourceHeadSha} auth=${auth.authorizationId} target=${auth.targetSha}`);
          NODE
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            source_run='${{ github.event.workflow_run.id }}'
            source_event='${{ github.event.workflow_run.event }}'
            source_branch='${{ github.event.workflow_run.head_branch }}'
            source_head_sha='${{ github.event.workflow_run.head_sha }}'
            source_repo="$GITHUB_REPOSITORY"
            test "$source_event" = "workflow_dispatch" || { echo "Unexpected source event $source_event" >&2; exit 1; }
            test "$source_branch" = "main" || { echo "Recovery authorization source branch must be main; got $source_branch" >&2; exit 1; }
            artifact_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$source_run/artifacts" --jq '.artifacts | map(select(.expired == false and (.name | startswith("recovery-authorization-")))) | .[0].id // empty')
            test -n "$artifact_id" || { echo "No recovery authorization artifact on source run $source_run" >&2; exit 1; }
            rm -rf /tmp/hnk-recovery-auth-search/*
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/hnk-recovery-auth.zip
            unzip -q /tmp/hnk-recovery-auth.zip -d /tmp/hnk-recovery-auth-search
            auth=$(find /tmp/hnk-recovery-auth-search -name recovery-authorization.json -type f | head -n1 || true)
            healthy=$(find /tmp/hnk-recovery-auth-search -name healthy-promotion-report.json -type f | head -n1 || true)
            test -n "$auth" && [ -n "$healthy" ] || { echo "Source authorization evidence incomplete" >&2; exit 1; }
            validate_and_bind "$auth" "$healthy" "$source_run" "$source_event" "$source_branch" "$source_head_sha" "$source_repo"
          else
            found=""
            runs=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/recovery-authorization.yml/runs?status=success&per_page=50" --jq '.workflow_runs[].id')
            for run_id in $runs; do
              IFS=$'\t' read -r source_event source_branch source_head_sha source_repo <<< "$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '[.event,.head_branch,.head_sha,.repository.full_name] | @tsv')"
              [ "$source_event" = "workflow_dispatch" ] && [ "$source_branch" = "main" ] && [ "$source_repo" = "$GITHUB_REPOSITORY" ] || continue
              artifact_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts | map(select(.expired == false and (.name | startswith("recovery-authorization-")))) | .[0].id // empty')
              [ -n "$artifact_id" ] || continue
              rm -rf /tmp/hnk-recovery-auth-search/*
              gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/hnk-recovery-auth.zip || continue
              unzip -q /tmp/hnk-recovery-auth.zip -d /tmp/hnk-recovery-auth-search || continue
              auth=$(find /tmp/hnk-recovery-auth-search -name recovery-authorization.json -type f | head -n1 || true)
              healthy=$(find /tmp/hnk-recovery-auth-search -name healthy-promotion-report.json -type f | head -n1 || true)
              [ -n "$auth" ] && [ -n "$healthy" ] || continue
              ok=$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(x.authorizationId===process.env.HNK_RECOVERY_AUTHORIZATION_ID&&x.targetSha===process.env.HNK_RECOVERY_TARGET_SHA&&x.authorized===true&&x.decision==="authorized"?"yes":"no")' "$auth")
              if [ "$ok" = "yes" ]; then
                validate_and_bind "$auth" "$healthy" "$run_id" "$source_event" "$source_branch" "$source_head_sha" "$source_repo"
                found="$run_id"
                break
              fi
            done
            test -n "$found" || { echo "Recovery authorization $HNK_RECOVERY_AUTHORIZATION_ID for $HNK_RECOVERY_TARGET_SHA not found" >&2; exit 1; }
          fi

      - name: Revalidate live Recovery Gate and authorized fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HNK_TELEMETRY_BASE_URL" && test -n "$HNK_TELEMETRY_ADMIN_TOKEN"
          curl -fsS -H "Authorization: Bearer $HNK_TELEMETRY_ADMIN_TOKEN" "$HNK_TELEMETRY_BASE_URL/api/recovery" > artifacts/recovery-execution-input/recovery-gate.json
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("artifacts/recovery-execution-input/recovery-authorization.json","utf8"));const g=JSON.parse(fs.readFileSync("artifacts/recovery-execution-input/recovery-gate.json","utf8"));if(g.blocked!==true||g.decision!=="rollback_recommended")throw new Error(`live recovery gate is ${g.decision}`);if(!g.recommendations?.some(x=>x.fingerprint===a.incidentFingerprint))throw new Error("authorized incident is not currently blocking");console.log(`rollback still required for ${a.incidentFingerprint}`)'

      - name: Execute authorized recovery and verify exact release manifest
        run: node .github/scripts/execute-recovery.mjs

      - name: Validate telemetry control center after recovery
        shell: bash
        run: |
          set -euo pipefail
          HNK_BUILD_SHA="$HNK_RECOVERY_TARGET_SHA" HNK_RELEASE=recovery-post-smoke node apps/telemetry-control/scripts/production-smoke.mjs > artifacts/recovery-post-smoke.json

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ github.run_id }}
          path: |
            artifacts/recovery-execution-input/recovery-authorization.json
            artifacts/recovery-execution-input/healthy-promotion-report.json
            artifacts/recovery-execution-input/recovery-gate.json
            artifacts/recovery-report.json
            artifacts/recovery-report.md
            artifacts/recovery-post-smoke.json
          if-no-files-found: warn
          retention-days: 180
