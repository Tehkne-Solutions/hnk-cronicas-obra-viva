name: quality-release-gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Commit SHA to evaluate (blank = current ref)"
        required: false
        type: string
  workflow_run:
    workflows: [foundation]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: quality-release-gate-${{ github.event.workflow_run.head_sha || inputs.candidate_sha || github.sha }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HNK_TELEMETRY_BASE_URL: ${{ secrets.HNK_TELEMETRY_BASE_URL }}
      HNK_TELEMETRY_ADMIN_TOKEN: ${{ secrets.HNK_TELEMETRY_ADMIN_TOKEN }}
      HNK_TELEMETRY_GAME_ORIGIN: ${{ secrets.HNK_TELEMETRY_GAME_ORIGIN }}
      HNK_RELEASE_CANDIDATE_TTL_HOURS: 24
    steps:
      - name: Resolve candidate
        id: candidate
        shell: bash
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          if [ -z "$sha" ]; then sha="${{ inputs.candidate_sha }}"; fi
          if [ -z "$sha" ]; then sha="${{ github.sha }}"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "HNK_CANDIDATE_SHA=$sha" >> "$GITHUB_ENV"
          echo "HNK_BUILD_SHA=$sha" >> "$GITHUB_ENV"
          echo "HNK_RELEASE=quality-release-gate" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch successful foundation quality report for candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate-quality
          run_id=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/foundation.yml/runs?head_sha=$HNK_CANDIDATE_SHA&status=success&per_page=20" \
            --jq '.workflow_runs | map(select(.conclusion == "success")) | .[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "No successful foundation run exists for candidate $HNK_CANDIDATE_SHA" >&2
            exit 1
          fi
          artifact_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
            --jq '.artifacts | map(select(.expired == false and (.name | startswith("ci-quality-report-")))) | .[0].id // empty')
          if [ -z "$artifact_id" ]; then
            echo "Successful foundation run $run_id has no CI quality artifact" >&2
            exit 1
          fi
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/ci-quality.zip
          unzip -q /tmp/ci-quality.zip -d artifacts/candidate-quality
          test -f artifacts/candidate-quality/ci-quality-report.json
          node -e 'const fs=require("fs");const q=JSON.parse(fs.readFileSync("artifacts/candidate-quality/ci-quality-report.json","utf8"));if(q.sha!==process.env.HNK_CANDIDATE_SHA)throw new Error(`quality SHA mismatch ${q.sha}`);if(q.result!=="pass")throw new Error(`foundation result ${q.result}`);const s=q.regressionBudget?.status;if(!["pass","warn"].includes(s))throw new Error(`regression budget ${s}`);console.log(`budget=${s} baseline=${q.regressionBudget.baseline?.sha??"none"}${s==="warn"?" (non-blocking warning)":""}`)'
          echo "foundation run: $run_id"

      - name: Require production telemetry configuration
        shell: bash
        run: |
          test -n "$HNK_TELEMETRY_BASE_URL" || { echo "HNK_TELEMETRY_BASE_URL is required" >&2; exit 1; }
          test -n "$HNK_TELEMETRY_ADMIN_TOKEN" || { echo "HNK_TELEMETRY_ADMIN_TOKEN is required" >&2; exit 1; }

      - name: Run current production smoke
        shell: bash
        run: node apps/telemetry-control/scripts/production-smoke.mjs > artifacts/release-smoke.json

      - name: Evaluate release eligibility
        id: release_gate
        shell: bash
        run: node .github/scripts/release-gate.mjs

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-release-gate-${{ steps.candidate.outputs.sha }}-${{ github.run_id }}
          path: |
            artifacts/candidate-quality/ci-quality-report.json
            artifacts/release-smoke.json
            artifacts/release-gate-report.json
            artifacts/release-gate-report.md
            artifacts/release-candidate.json
          if-no-files-found: warn
          retention-days: 30
