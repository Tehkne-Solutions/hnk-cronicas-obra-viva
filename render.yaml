services:
  - type: web
    name: hnk-telemetry-control
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./Dockerfile.telemetry-control
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hnk-telemetry-db
          property: connectionString
      - key: HNK_TELEMETRY_DB_SSL
        value: "false"
      - key: HNK_TELEMETRY_ADMIN_TOKEN
        generateValue: true
      - key: HNK_TELEMETRY_ALLOWED_ORIGINS
        sync: false
      - key: HNK_TELEMETRY_ALERT_WEBHOOK
        sync: false
      - key: HNK_TELEMETRY_ALERT_MIN_LEVEL
        value: warn
      - key: HNK_TELEMETRY_ALERT_COOLDOWN_MS
        value: "900000"
      - key: HNK_TELEMETRY_RETENTION_DAYS
        value: "30"
      - key: HNK_TELEMETRY_RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: HNK_RELEASE
        value: production

databases:
  - name: hnk-telemetry-db
    plan: basic-256mb
    region: virginia
    diskSizeGB: 5
    storageAutoscalingEnabled: false
    connectionPool: none
    ipAllowList: []
